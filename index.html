<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee9ff">
  <meta name="description" content="和 LoveMi 聊聊生活与期待，慢慢遇见更懂你的关系。">
  <title>LoveMi · 慢慢认识你</title>
  <link rel="icon" href="assets/paw.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/app.css">
  <script src="src/engine.js" defer></script>
  <script src="local_model_client.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <main class="app-shell" id="app">
    <header class="journey-header">
      <nav class="top-nav" aria-label="页面导航">
        <button class="icon-button back-button" id="back" aria-label="返回首页">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 5h8v14h-8M13 12H4m0 0 4-4m-4 4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="nav-wordmark">LoveMi</span>
        <button class="icon-button more-button" id="more" aria-label="更多选项" aria-expanded="false"><span></span><span></span><span></span></button>
      </nav>
      <div class="progress-area">
        <div class="progress-track" id="progress" role="progressbar" aria-label="个人画像构建度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
          <svg class="walking-cat" id="walking-cat" viewBox="0 0 48 42" aria-hidden="true"><path d="M15 24c-7-1-8-7-8-12 0-5 1-8 4-8s4 4 3 7c-1 3-1 6 2 7l4 2 7-1 2-5 1-6 5 4 5-2 1 6 4 4-2 5-5 1 2 5h-6l-4-5h-4l-2 9h-5l-1-7-3 7h-5l3-12Z" fill="currentColor"/><circle cx="38" cy="17" r="1" fill="#fff"/></svg>
          <img class="progress-paw" src="assets/paw.svg" alt="">
        </div>
        <p class="progress-label">个人画像构建度：<span id="progress-value">0</span>%</p>
      </div>
      <div class="mascot" aria-label="LoveMi，你的 AI 关系军师">
        <div class="mascot-halo"></div>
        <img class="mascot-image" src="assets/lovemi-cat-wave.png" alt="挥着小爪的 LoveMi 猫咪" fetchpriority="high">
        <span class="mascot-name">LoveMi</span>
      </div>
    </header>

    <section class="conversation" id="conversation" aria-label="与 LoveMi 的对话" aria-live="polite" aria-relevant="additions"></section>

    <footer class="chat-footer" id="chat-footer">
      <div class="quick-replies" id="quick-replies" aria-label="快捷回复"></div>
      <form class="composer" id="composer">
        <label class="sr-only" for="message-input">和 LoveMi 说说你的想法</label>
        <textarea id="message-input" rows="1" placeholder="想到什么，都可以和我说说～" maxlength="1000" autocomplete="off" enterkeyhint="send"></textarea>
        <button class="send-button" id="send" type="submit" aria-label="发送消息"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
    </footer>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="menu-popover" id="menu" hidden>
      <button id="restart">重新认识我</button>
      <a href="debug" id="debug-link">打开调试工作台</a>
    </div>
    <section class="home-screen" id="home-screen" hidden aria-label="LoveMi 首页">
      <div class="home-heart">♡</div>
      <p class="home-eyebrow">LOVE, A LITTLE MORE UNDERSTOOD.</p>
      <h1>慢慢认识你，<br>也慢慢靠近爱。</h1>
      <p class="home-description">关于生活，关于期待。<br>那些细小的想法，LoveMi 都想认真听。</p>
      <button class="button primary home-continue" id="home-continue">继续和 LoveMi 聊聊</button>
      <button class="button secondary" id="home-profile" hidden>查看我的画像</button>
    </section>
    <dialog class="confirm-dialog" id="restart-dialog">
      <h2>重新认识一次？</h2>
      <p>这次的聊天会重新开始，已保存的画像会为你留着。</p>
      <div class="dialog-actions"><button class="button secondary" id="cancel-restart">再聊聊</button><button class="button primary" id="confirm-restart">重新开始</button></div>
    </dialog>
  </main>
</body>
</html>
